name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tokens:
    name: build + parity + contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails on drift from the committed snapshot, or any pair below WCAG AA.
      - run: npm run check
      # Generated llms-full.txt must match the contract docs; llms.txt links must resolve.
      - run: npm run check:llms
      # Agent entry points are copied onto the docs site (design.thehoomanloop.com/llms.txt).
      - name: docs site serves llms.txt
        run: |
          test -s docs/llms.txt
          test -s docs/llms-full.txt
      # Text-layer spec and renderer must land in dist/ with the rest of the contract.
      - name: text-layer outputs exist
        run: |
          test -s dist/text.json
          test -s dist/text.py
          test -s dist/css/text.css
          python3 -c "import json; json.load(open('dist/tokens.json'))['text']['column']['chat']"

  text:
    name: text layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Linter, golden board, generated renderer, and review artifacts.
      - run: npm run check:text
